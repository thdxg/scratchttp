[settings]
lockfile = true

[env]
ADDRESS = "localhost:8080"
TESTDATA = "{{ config_root }}/data.json"
GOTOOLCHAIN = "local"

[tools]
# go
go = "1.27.2"
"go:golang.org/x/tools/gopls" = "0.24.0"
"go:golang.org/x/tools/cmd/goimports" = "0.52.0"
"aqua:golangci/golangci-lint" = "2.15.0"
"aqua:nametake/golangci-lint-langserver" = "0.0.12"
# rust
rust = { version = "1.99.1", profile = "minimal", components = "rustfmt,clippy,rust-analyzer,rust-src" }
#zig
zig = "0.17.0"
zls = "0.16.0"

[tasks."test:go"]
dir = "{{ config_root }}/go"
run = "go test"

[tasks."test:rust"]
dir = "{{ config_root }}/rust"
run = "cargo test"
